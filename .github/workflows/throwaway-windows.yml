name: Throwaway Windows check

# On a throwaway branch of the fork only. Not part of the pull request.
on:
  push:
    branches: ["ci-check-*"]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 170
    env:
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Rust 1.95
        run: |
          rustup toolchain install 1.95.0 --profile minimal --no-self-update
          rustup default 1.95.0
      - name: The roots tests, with their output
        shell: bash
        run: cargo test --locked -p "${APP}-engine" --lib file_access -- --nocapture --test-threads=1
        env:
          APP: ${{ github.event.repository.name }}
      - name: Without each fix, its tests have to fail
        shell: bash
        run: python .github/throwaway/mutate.py "${APP}-engine"
        env:
          APP: ${{ github.event.repository.name }}
      - name: Two libraries, one file name, with the fix and without it
        shell: bash
        run: |
          cargo test --locked -p vectorcraft-engine --lib a_library_named_like_a_device -- --nocapture
          cargo test --locked -p vectorcraft-engine --lib keeps_off_a_file_another_program_replaced -- --nocapture
          cargo test --locked -p vectorcraft-engine --lib device_named_libraries_without_a_title -- --nocapture
          sed -i 's/other != name/other != other/' crates/engine/src/cmd/swatchlib.rs
          git diff --stat
          if cargo test --locked -p vectorcraft-engine --lib a_library_named_like_a_device; then echo "!!! passed without the fix"; exit 1; fi
          git checkout crates/engine/src/cmd/swatchlib.rs
          sed -i '/self.saved_as.insert/d' crates/engine/src/cmd/swatchlib.rs
          git diff --stat
          if cargo test --locked -p vectorcraft-engine --lib device_named_libraries_without_a_title; then echo "!!! passed without the title check"; exit 1; fi
          git checkout crates/engine/src/cmd/swatchlib.rs
          sed -i '/None if untitled/d' crates/engine/src/cmd/swatchlib.rs
          git diff --stat
          if cargo test --locked -p vectorcraft-engine --lib device_named_libraries_without_a_title; then echo "!!! passed without the unknown owner check"; exit 1; fi
          git checkout crates/engine/src/cmd/swatchlib.rs
          sed -i '/self.saved_as.remove(&key)/d' crates/engine/src/cmd/swatchlib.rs
          git diff --stat
          if cargo test --locked -p vectorcraft-engine --lib keeps_off_a_file_another_program_replaced; then echo "!!! passed without forgetting"; exit 1; fi
          git checkout crates/engine/src/cmd/swatchlib.rs
          sed -i 's/if held || unread {/if held {/' crates/engine/src/cmd/swatchlib.rs
          git diff --stat
          if cargo test --locked -p vectorcraft-engine --lib keeps_off_a_file_another_program_replaced; then echo "!!! passed without keeping off unread files"; exit 1; fi
          git checkout crates/engine/src/cmd/swatchlib.rs
